{% extends "base.html" %}
{% load static %}

{% block body %}
<div class="min-h-screen bg-gradient-to-b from-gray-900 to-gray-800 py-10 text-gray-100">
  {% include "includes/navbar.html" %}

  <div class="container mx-auto px-4 py-8 mt-8">
    <h1 class="text-3xl sm:text-4xl font-bold mb-8 text-center text-gray-200">Search Demands</h1>

    <div class="mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="md:col-span-2">
        <input type="text" id="place-search" placeholder="Search for a location..."
               class="w-full px-4 py-3 rounded-lg bg-gray-800/50 border border-gray-700 text-white font-mono
                      focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition-all duration-300
                      hover:bg-gray-800/70 hover:shadow-lg focus:outline-none">
      </div>
      <div>
        <select id="category-filter"
                class="w-full px-4 py-3 rounded-lg bg-gray-800/50 border border-gray-700 text-white
                       focus:border-blue-500 focus:ring-2 focus:ring-blue-500 transition-all duration-300
                       hover:bg-gray-800/70 hover:shadow-lg focus:outline-none">
          <option value="all">All Categories</option>
          {% for value, label in categories %}
            <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Map -->
      <div class="lg:col-span-2">
        <div class="rounded-xl overflow-hidden shadow-2xl">
          <div id="map-status" class="flex items-center justify-center bg-gray-900/60" style="height:70vh;">
            <div class="spinner h-16 w-16"></div>
            <span class="ml-4 text-xl text-gray-200">Loading Map ...</span>
          </div>
          <div id="demands-map" class="w-full hidden" style="height:70vh;"></div>
        </div>
      </div>

      <!-- Detail panel -->
      <div class="bg-gray-800/30 backdrop-blur-sm p-6 rounded-xl shadow-xl border border-gray-700/50
                  h-[70vh] overflow-y-auto transition-all duration-300 hover:shadow-2xl">
        <h2 id="detail-title" class="text-2xl font-bold mb-4 text-blue-400">Demand Details</h2>

        <div id="detail-empty" class="flex flex-col items-center justify-center h-full text-center text-gray-400">
          <svg class="h-16 w-16 mb-4 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
          </svg>
          <p class="text-lg">Click on a marker on the map to view demand</p>
        </div>

        <div id="detail-body" class="hidden"></div>
      </div>
    </div>

    <!-- Nearby list -->
    <div id="list-section" class="mt-8 hidden">
      <h2 id="list-heading" class="text-2xl font-bold mb-4 text-gray-200">Nearby Demands</h2>
      <div id="demand-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div class="mt-6 text-center">
        <button type="button" id="load-more"
                class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition mx-2 hidden">
          Load More Demands
        </button>
        <button type="button" id="show-less"
                class="px-4 py-2 bg-gray-600 text-white font-semibold rounded-md hover:bg-gray-700 transition mx-2 hidden">
          Show Less
        </button>
      </div>
    </div>
  </div>

  {% include "includes/footer.html" %}
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/search-demands.js' %}"></script>
{% endblock %}
