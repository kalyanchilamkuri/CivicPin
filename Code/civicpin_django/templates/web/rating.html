{% extends "base.html" %}
{% load static %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gray-900 text-white px-4 py-12">
  <div class="w-full max-w-md p-6 rounded-lg shadow-lg bg-gray-800">
    <h1 class="text-3xl font-bold mb-6 text-center">Leave a Review</h1>

    <p id="form-error" class="text-red-500 mb-4 text-center hidden"></p>
    <p id="form-success" class="text-green-500 mb-4 text-center hidden"></p>

    <form id="review-form" novalidate>
      {% if not user.is_authenticated %}
      <div class="mb-6">
        <label for="review-email" class="block font-medium mb-2">Your Email</label>
        <input type="email" id="review-email" name="email" placeholder="you@example.com"
               class="w-full p-3 border rounded bg-gray-700 text-white border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      {% else %}
      <p class="text-sm text-gray-400 mb-6 text-center">
        Posting as <span class="text-blue-300">{{ user.email }}</span>
      </p>
      {% endif %}

      <div class="mb-6">
        <label for="review-text" class="block font-medium mb-2">Your Review</label>
        <textarea id="review-text" name="review" rows="4" placeholder="Write your review here..."
                  class="w-full p-3 border rounded bg-gray-700 text-white border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500">{% if existing %}{{ existing.review }}{% endif %}</textarea>
      </div>

      <div class="mb-6 text-center">
        <label class="block font-medium mb-2">Your Rating</label>
        <div class="flex items-center justify-center space-x-2" id="stars" role="radiogroup" aria-label="Rating">
          {% for star in "12345" %}
          <button type="button" class="star-button" data-value="{{ forloop.counter }}"
                  role="radio" aria-label="{{ forloop.counter }} star{{ forloop.counter|pluralize }}"
                  aria-checked="false">
            <svg class="w-8 h-8 cursor-pointer hover:scale-110 transition-transform"
                 fill="none" stroke="white" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.518 4.674a1 1 0 00.95.69h4.908c.969 0 1.371 1.24.588 1.81l-3.973 2.884a1 1 0 00-.364 1.118l1.518 4.674c.3.921-.755 1.688-1.538 1.118l-3.973-2.884a1 1 0 00-1.176 0l-3.973 2.884c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.364-1.118L2.986 9.1c-.783-.57-.38-1.81.588-1.81h4.908a1 1 0 00.95-.69l1.518-4.674z"/>
            </svg>
          </button>
          {% endfor %}
        </div>
      </div>

      <button type="submit" id="review-submit"
              class="w-full py-3 rounded-lg font-semibold bg-blue-600 text-white hover:bg-blue-700 transition-colors disabled:opacity-60">
        Submit Review
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="{% url 'web:home' %}" class="text-blue-400 hover:underline text-sm">Back to home</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  window.CIVICPIN.existingRating = {% if existing %}{{ existing.rating }}{% else %}0{% endif %};
</script>
<script src="{% static 'js/rating.js' %}"></script>
{% endblock %}
