{% extends "base.html" %}
{% load static %}

{% block head %}
<style>
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  .fade-in { opacity: 0; animation: fadeIn .5s ease forwards; }
</style>
{% endblock %}

{% block body %}
<div class="min-h-screen bg-zinc-900 flex items-center justify-center relative overflow-hidden px-4">

  <div id="glow"
       class="absolute w-64 h-64 rounded-full bg-blue-600 opacity-20 blur-3xl transition-all duration-1000 pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-lg text-center p-8">
    <h1 class="relative text-7xl sm:text-9xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-600">
      404
      <span class="absolute -top-4 -right-4 text-2xl text-blue-400 animate-bounce">!</span>
    </h1>

    <div class="h-1 bg-gradient-to-r from-blue-400 to-purple-600 rounded-full mx-auto my-6 transition-all duration-1000"
         style="width:70%"></div>

    <h2 class="text-2xl sm:text-3xl font-semibold text-zinc-100 mb-4 flex items-center justify-center gap-2 flex-wrap">
      <span class="fade-in" style="animation-delay:.2s">Page</span>
      <span class="fade-in" style="animation-delay:.4s">Not</span>
      <span class="fade-in" style="animation-delay:.6s">Found</span>
      <span class="fade-in text-yellow-400" style="animation-delay:.8s">
        <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path stroke-linecap="round" d="M16 16s-1.5-2-4-2-4 2-4 2M9 9h.01M15 9h.01"/>
        </svg>
      </span>
    </h2>

    <p class="text-lg text-zinc-400 mb-8 fade-in" style="animation-delay:1s">
      The page you&rsquo;re looking for doesn&rsquo;t exist or has been moved.
    </p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <a href="{% url 'web:home' %}"
         class="group px-6 py-3 bg-gradient-to-r from-blue-500 to-blue-700 text-white rounded-lg transition duration-300 flex items-center justify-center gap-2 hover:shadow-lg hover:shadow-blue-500/20 transform hover:-translate-y-1">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10h14V10"/>
        </svg>
        Go Home
      </a>
      <button type="button" onclick="window.history.back()"
              class="group px-6 py-3 bg-zinc-700 text-zinc-100 rounded-lg transition duration-300 flex items-center justify-center gap-2 hover:bg-zinc-600 transform hover:-translate-y-1">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 1018 0 9 9 0 00-18 0zm0 0l3-3m-3 3l3 3"/>
        </svg>
        Go Back
      </button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // The glow follows the pointer, as the original 404 component did.
  (function () {
    var glow = document.getElementById('glow');
    if (!glow) return;
    window.addEventListener('pointermove', function (event) {
      glow.style.left = event.clientX - 128 + 'px';
      glow.style.top = event.clientY - 128 + 'px';
    }, { passive: true });
  })();
</script>
{% endblock %}
