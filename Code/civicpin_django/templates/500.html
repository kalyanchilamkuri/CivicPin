{% extends "base.html" %}

{% block body %}
<div class="min-h-screen bg-zinc-900 flex items-center justify-center px-4">
  <div class="text-center max-w-lg">
    <h1 class="text-7xl sm:text-9xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-red-400 to-orange-600">
      500
    </h1>
    <div class="h-1 w-2/3 bg-gradient-to-r from-red-400 to-orange-600 rounded-full mx-auto my-6"></div>
    <h2 class="text-2xl sm:text-3xl font-semibold text-zinc-100 mb-4">Something went wrong</h2>
    <p class="text-lg text-zinc-400 mb-8">
      The server hit an unexpected error. Please try again in a moment.
    </p>
    <a href="/"
       class="inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-blue-500 to-blue-700 text-white rounded-lg transition duration-300 hover:shadow-lg hover:shadow-blue-500/20 transform hover:-translate-y-1">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10h14V10"/>
      </svg>
      Go Home
    </a>
  </div>
</div>
{% endblock %}
